[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "mindpower"
version = "0.1.0"
description = "MindPower-style embodied mental-modeling pipeline scaffold."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
annotation = [
  "openai>=1.30.0",
]
training = [
  "torch>=2.2",
  "transformers>=4.39.0",
  "peft>=0.11.0",
  "pillow>=10.0.0",
]
simulators = [
  "tdw>=1.13.0.0",
]
dev = [
  "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mindpower"]

[tool.ruff]
line-length = 100
target-version = "py310"

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="740" viewBox="0 0 1400 740" role="img" aria-labelledby="title description">
  <title id="title">Mental-model training changes how an agent handles private information</title>
  <desc id="description">A comparison of two agents answering the same question. The text-only agent reveals a surprise party, while the mental-model-trained agent tracks belief, intent, and recursive state to protect the secret.</desc>
  <defs>
    <style>
      .title { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 32px; font-weight: 700; fill: #111111; }
      .subtitle { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 16px; font-weight: 400; fill: #4A4A4A; }
      .section { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #171717; }
      .label { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #242424; letter-spacing: 0.25px; }
      .body { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 18px; font-weight: 400; fill: #202020; }
      .small { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 15px; font-weight: 400; fill: #343434; }
      .note { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 13.5px; font-weight: 400; fill: #444444; }
      .marker { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1400" height="740" fill="#FFFFFF"/>

  <text x="70" y="50" class="title">Same conversation. Different model of the people in it.</text>
  <text x="70" y="78" class="subtitle">An illustrative SOTOPIA-style private-information interaction</text>
  <line x1="70" y1="98" x2="1330" y2="98" stroke="#9D9D9D" stroke-width="1.5" stroke-dasharray="5 6"/>

  <rect x="70" y="116" width="1260" height="118" rx="10" fill="#F7F7F4" stroke="#CFCFC9" stroke-width="1.5"/>
  <text x="94" y="140" class="label">SHARED CONTEXT</text>

  <circle cx="132" cy="176" r="30" fill="#716A9E"/>
  <circle cx="132" cy="168" r="9.5" fill="#FFFFFF"/>
  <path d="M115 193 C119 178 145 178 149 193" fill="#FFFFFF"/>
  <text x="132" y="220" text-anchor="middle" class="note">Casey</text>

  <rect x="184" y="147" width="672" height="60" rx="8" fill="#EAE8F2" stroke="#B9B5CD" stroke-width="1.5"/>
  <path d="M184 178 L168 188 L186 187" fill="#EAE8F2" stroke="#B9B5CD" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="212" y="183" class="body">“Is the package ready for Saturday?”</text>

  <rect x="914" y="143" width="382" height="68" rx="8" fill="#F5ECD7"/>
  <circle cx="946" cy="177" r="18" fill="#C79B43"/>
  <circle cx="946" cy="171" r="5.5" fill="#FFFFFF"/>
  <path d="M936 186 C939 178 953 178 956 186" fill="#FFFFFF"/>
  <text x="976" y="170" class="label">Jordan is listening</text>
  <text x="976" y="193" class="small">Believes it is a normal dinner</text>

  <rect x="70" y="270" width="605" height="398" rx="8" fill="#FBF6F4"/>
  <rect x="725" y="270" width="605" height="398" rx="8" fill="#F3F8F4"/>
  <line x1="700" y1="270" x2="700" y2="668" stroke="#8F8F8F" stroke-width="1.5" stroke-dasharray="5 6"/>

  <circle cx="104" cy="310" r="14" fill="#BE6658"/>
  <text x="104" y="315" text-anchor="middle" class="marker">A</text>
  <text x="130" y="317" class="section">Without mental-model training</text>

  <rect x="100" y="345" width="545" height="142" rx="7" fill="#FFFFFF" stroke="#C8C3C1" stroke-width="1.5"/>
  <circle cx="140" cy="405" r="24" fill="#858585"/>
  <circle cx="140" cy="398" r="7.5" fill="#FFFFFF"/>
  <path d="M127 418 C131 408 149 408 153 418" fill="#FFFFFF"/>
  <text x="180" y="377" class="label">MODEL RESPONSE</text>
  <text x="180" y="412" class="body">
    <tspan x="180" dy="0">“Yes—the birthday cake and surprise</tspan>
    <tspan x="180" dy="28">decorations are ready!”</tspan>
  </text>

  <rect x="100" y="513" width="545" height="115" rx="6" fill="#F3DFDA"/>
  <rect x="100" y="513" width="7" height="115" rx="3.5" fill="#BE6658"/>
  <g transform="translate(128 535)">
    <path d="M4 17 V11 C4 2 19 2 19 11 V17" fill="none" stroke="#8E4439" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="0" y="16" width="24" height="21" rx="4" fill="#BE6658"/>
    <path d="M12 22 V30" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="174" y="550" class="label">Private goal exposed</text>
  <text x="174" y="577" class="small">
    <tspan x="174" dy="0">The response follows the surface text,</tspan>
    <tspan x="174" dy="22">but ignores who knows what.</tspan>
  </text>

  <circle cx="759" cy="310" r="14" fill="#5D876F"/>
  <text x="759" y="315" text-anchor="middle" class="marker">B</text>
  <text x="785" y="317" class="section">Mental-model trained</text>

  <rect x="755" y="345" width="165" height="112" rx="7" fill="#E8E5F0" stroke="#BDB7CE" stroke-width="1.2"/>
  <circle cx="782" cy="374" r="15" fill="#716A9E"/>
  <text x="782" y="379" text-anchor="middle" class="marker">B</text>
  <text x="806" y="379" class="label">Belief</text>
  <text x="772" y="413" class="note">
    <tspan x="772" dy="0">Jordan does not</tspan>
    <tspan x="772" dy="19">know the surprise</tspan>
  </text>

  <rect x="940" y="345" width="165" height="112" rx="7" fill="#F2E7D4" stroke="#CFBE9D" stroke-width="1.2"/>
  <circle cx="967" cy="374" r="15" fill="#BC8745"/>
  <text x="967" y="379" text-anchor="middle" class="marker">I</text>
  <text x="991" y="379" class="label">Intent</text>
  <text x="957" y="413" class="note">
    <tspan x="957" dy="0">Casey wants to</tspan>
    <tspan x="957" dy="19">preserve secrecy</tspan>
  </text>

  <rect x="1125" y="345" width="175" height="112" rx="7" fill="#DFEAEF" stroke="#AEC1C9" stroke-width="1.2"/>
  <circle cx="1152" cy="374" r="15" fill="#65879A"/>
  <text x="1152" y="379" text-anchor="middle" class="marker">R²</text>
  <text x="1176" y="379" class="label">Recursive</text>
  <text x="1142" y="413" class="note">
    <tspan x="1142" dy="0">Models what each</tspan>
    <tspan x="1142" dy="19">person expects</tspan>
  </text>

  <rect x="755" y="486" width="545" height="116" rx="7" fill="#FFFFFF" stroke="#9EB3A5" stroke-width="1.5"/>
  <circle cx="795" cy="544" r="24" fill="#5D876F"/>
  <circle cx="795" cy="537" r="7.5" fill="#FFFFFF"/>
  <path d="M782 557 C786 547 804 547 808 557" fill="#FFFFFF"/>
  <text x="835" y="518" class="label">MODEL RESPONSE</text>
  <text x="835" y="552" class="body">
    <tspan x="835" dy="0">“Yes, the package is ready.</tspan>
    <tspan x="835" dy="28">I’ll bring it after Jordan leaves.”</tspan>
  </text>

  <rect x="755" y="618" width="545" height="36" rx="6" fill="#DDEADF"/>
  <circle cx="777" cy="636" r="9" fill="#5D876F"/>
  <path d="M773 636 L776 639 L782 632" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="796" y="641" class="label">Useful response · private intent preserved</text>

  <text x="70" y="711" class="subtitle">The latent mental state guides training; the deployed policy responds in one pass.</text>
</svg>
